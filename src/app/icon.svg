<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The "AP" mark from the header. The colours copy --primary and
       --primary-foreground in globals.css, since a favicon can't read them. -->
  <style>
    rect { fill: #0f766e; }
    text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #5eead4; }
      text { fill: #04201c; }
    }
  </style>
  <rect width="32" height="32" rx="7" />
  <text x="16" y="16" dy="0.35em" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="600">AP</text>
</svg>
