# Every pull request and push is checked. Pushes to main also publish the
# image the Raspberry Pi runs, built on an ARM runner so it's native arm64.
name: CI

on:
    pull_request:
    push:
        branches: [main]

# Nothing more than reading the code, unless a job asks.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Format, lint, typecheck and build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            # Also validates every file in content/.
            - run: pnpm build

    publish:
        name: Publish the arm64 image
        needs: check
        # Only main publishes: pull requests, including from forks, never do.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04-arm
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  # "latest" is what the Pi runs; the commit hash is for rollbacks.
                  tags: |
                      type=raw,value=latest
                      type=sha
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
